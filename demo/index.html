<!doctype html>
<html lang="en">

<head>

	<style>
		body {
			margin: 0;
			font-family: Georgia, serif;
			background: #f3e9d8;
		}

		h1,
		h2,
		p {
			color: #8b0000;
		}

		.host-chrome {
			padding: 1.5rem;

		}

<body>
	<div class="host-chrome">

		</p>
	</div>

	<div style="width:480px; height:600px; outline:2px dashed #8b0000">
		<enterprise-directory></enterprise-directory>

	<div class="host-chrome">
